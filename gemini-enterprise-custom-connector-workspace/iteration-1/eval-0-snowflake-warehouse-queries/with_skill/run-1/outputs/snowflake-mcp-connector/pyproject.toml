[project]
name = "snowflake-mcp-connector"
version = "0.1.0"
description = "Custom MCP server exposing Snowflake sales data to Gemini Enterprise agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.2.0",
    "snowflake-connector-python>=3.7.0",
    "sqlglot>=23.0.0",
    "requests>=2.31.0",
    "google-cloud-secret-manager>=2.20.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
