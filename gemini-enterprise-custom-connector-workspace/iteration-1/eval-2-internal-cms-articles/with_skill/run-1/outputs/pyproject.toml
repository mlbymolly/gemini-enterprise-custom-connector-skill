[project]
name = "internal-cms-articles-connector"
version = "0.1.0"
description = "Gemini Enterprise custom ingestion connector for the internal CMS articles API."
requires-python = ">=3.11"
dependencies = [
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-storage>=2.16.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
